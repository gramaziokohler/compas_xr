name: compas_xr_docs
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - compas>=2.15.1,<3
  - compas_eve>=2,<3
  - compas_model=0.9.2
  - compas_pb>=1.1,<2
  - compas_timber>=2.1.1-rc0,<3
  - pip:
    - pyrebase4>4.7.1
    # dev requirements
    - attrs >=17.4
    - black >=22.12.0
    - bump-my-version
    - compas_invocations2
    - invoke >=0.14
    - rhino-stubs
    - ruff
    - sphinx_compas2_theme
    - twine
    - wheel
