on:
  push:
    tags:
      - "v*"

name: Create Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.10", "3.11"]

    steps:
      - uses: compas-dev/compas-actions.build@v4
        with:
          python: ${{ matrix.python }}
          invoke_lint: true
          check_import: true
          run_prebuild: true

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: compas-dev/compas-actions.publish@v3
        with:
          pypi_token: ${{ secrets.PYPI }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_ghpython_components: true
          gh_source: src/compas_xr/ghpython/components
          gh_target: src/compas_xr/ghpython/components/ghuser
          gh_prefix: "COMPAS XR: "
          release_name_prefix: COMPAS XR
          # compas_xr.mqtt ships generated protobuf bindings that are not committed.
          run_prebuild: true

  assets:
    name: Publish schema and binding assets
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # COMPAS XR owns compas_xr.proto, so it publishes the schema bundle and the
      # generated bindings for every supported language, the same way compas_pb does
      # for the COMPAS core types. Downstream runtimes such as the C# one pin a
      # released version instead of scraping this repository at some ref.
      - uses: compas-dev/compas-actions/release-assets@v1
        with:
          python-version: '3.12'
          management-tool: uv
          extras: dev
          invoke-tasks: create-class-assets
          paths: dist/proto/*.zip

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/proto/*.zip --clobber
